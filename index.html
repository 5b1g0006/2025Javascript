<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,inital-scale=1.0">
        <title>Javascript</title>

        <link rel="stylesheet" href="./CSS/index.css"> <!-- 引入首頁的CSS樣式(index.css) -->
        <!-- 
            rel="stylesheet"：用來連結外部 CSS。
            rel="icon"：用來設定網站小圖示（favicon）。
            rel="preload"：用來預先加載資源（如字體、圖片）。
            rel="alternate"：用來提供不同語言版本的網頁。 
        -->

    </head>

    <body>
        <div class="theme-toggle">
            <button id="themeToggleBtn" onclick="toggleTheme()"></button>
        </div>

        <h1>103下學期五專三年級JavaScript程式設計課程</h1> <!-- 標題 -->
        <p>Hello JavaScript</p> <!-- 段落內容 -->

        

        <div class="link-bar">
            <a href="index.html">首頁</a>
            <a href="#" onclick="loadPage('about.html')">關於我</a>
            <!-- <a href="#" onclick="loadPage('research.html')">研究</a> -->
            <a href="#" onclick="loadPage('homework.html')">作業</a>
            <a href="#" onclick="loadPage('reference.html')">參考資料</a>
            <!--
            <a href="#" onclick="loadPage('NxN.html')">N*N乘法表</a>
            <a href="#" onclick="loadPage('https://5b1g0006.github.io/2025_WaterPuzzle/')">水立方試管遊戲 作業</a>
            <a href="#" onclick="loadPage('https://5b1g0006.github.io/2025-react-app/')">React + Vite 作業</a>
            <a href="javascript:history.back()">返回上一頁</a> 
            -->
        </div>

        <div id="mainFrame" class="mainFrame">
            <!-- 這裡可以放首頁介紹文字 -->
             歡迎來到王芷涵的JavaScript課程網站！<br>
     
        </div>

        <script>
            function loadPage(url) {
                const frame = document.getElementById('mainFrame');
                frame.innerHTML = `<iframe src="${url}" style="width:100%;height:100%;border:none;"></iframe>`;
            }
            // 預設為夜晚模式
            let isDay = false;
            setNightMode();

            function toggleTheme() {
                if (isDay) {
                    setNightMode();
                } else {
                    setDayMode();
                }
            }
            function setDayMode() {
                document.body.style.backgroundImage = "url('./ing/starry morning.png')";
                const btn = document.getElementById('themeToggleBtn');
                btn.style.backgroundImage = "url('./ing/moon.png')";
                isDay = true;
            }
            function setNightMode() {
                document.body.style.backgroundImage = "url('./ing/starry night.jpg')";
                const btn = document.getElementById('themeToggleBtn');
                btn.style.backgroundImage = "url('./ing/sun.png')";
                isDay = false;
            }

        </script>
        

    </body>
</html>
