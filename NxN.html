<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript作業</title>
    <link rel="stylesheet" href="./CSS/NxN.css"> <!-- 引入CSS樣式(NxN.css) -->

    <script>
        function myFunction() {
            var n = document.getElementById("numberInput").value;
            var str = "<table>";

            for (let i = 1; i <= n; i++) {
                str += "<tr>";
                for (let j = 1; j <= n; j++) {
                    str += `<td> ${i} x ${j} = ${i * j} </td>`;
                }
                str += "</tr>";
            }
            str += "</table>";

            document.getElementById("table-container").innerHTML = str;
        }
    </script>
</head>

<body>
    <h1>N*N乘法表</h1>
    <label for="numberInput">請輸入數字:</label>
    <input type="number" id="numberInput" placeholder="請輸入數字">
    <input type="button" value="OK" title="OK" onclick="myFunction()">
    <div id="myId">
        <div class="table-cat-wrap">
            <!-- 表格容器 -->
            <div id="table-container"></div>
            <!-- 圖片容器 -->
            <div class="image-container"></div>
        </div>
    </div>
</body>

</html>
