<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作業總攬</title>

    <link rel="stylesheet" href="./CSS/homework.css"> <!-- 引入CSS樣式(homework.css) -->

</head>

<body>

    <div class="homework-container">
        <div class="sidebar">
            <button onclick="showHomework('NxN')">N*N乘法表</button>
            <button onclick="showHomework('water')">水立方試管遊戲</button>
            <button onclick="showHomework('react')">React + Vite 作業</button>
        </div>
        <div class="content">
            <div id="homeworkDetail">
                <p>請點選左側作業查看簡介。</p>
            </div>
        </div>
    </div>
    <script>
        function showHomework(type) {
            const detail = document.getElementById('homeworkDetail');
            if (type === 'NxN') {
                detail.innerHTML = `
                    <h2>N*N乘法表</h2>
                    <p>這是一個動態產生 N*N 乘法表的練習。</p>
                    <a href="NxN.html" target="_blank">前往網頁</a>
                `;
            } else if (type === 'water') {
                detail.innerHTML = `
                    <h2>水立方試管遊戲</h2>
                    <p>仿照水排序遊戲的網頁版實作。</p>
                    <a href="https://5b1g0006.github.io/2025_WaterPuzzle/" target="_blank">前往網頁</a>
                `;
            } else if (type === 'react') {
                detail.innerHTML = `
                    <h2>React + Vite 作業</h2>
                    <p>使用 React 與 Vite 製作的作業專案。</p>
                    <a href="https://5b1g0006.github.io/2025-react-app/" target="_blank">前往網頁</a>
                `;
            }
        }

    </script>
</body>

</html>
